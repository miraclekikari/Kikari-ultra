<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIKARI ULTRA - Plateforme Dynamique</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        [x-cloak] { display: none !important; }
        .prose h2 { color: #2563eb; font-size: 1.5rem; font-weight: bold; margin-top: 1.5rem; border-bottom: 2px solid #e2e8f0; }
        .prose h3 { color: #1e40af; font-size: 1.2rem; font-weight: bold; margin-top: 1rem; }
        .algo-block { background: #0f172a; color: #f8fafc; padding: 1.25rem; border-radius: 8px; font-family: 'Fira Code', monospace; margin: 1rem 0; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900" x-data="app()" :class="{ 'dark bg-slate-900 text-white': isDark }">

    <nav class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fas fa-university"></i></div>
            <span class="text-xl font-black">KIKARI <span class="text-blue-600">ULTRA</span></span>
        </div>
        <div class="flex items-center gap-4">
            <button @click="isDark = !isDark" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">
                <i class="fas" :class="isDark ? 'fa-sun text-yellow-400' : 'fa-moon text-slate-500'"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <div class="mb-8 flex justify-between items-end">
            <h1 class="text-3xl font-bold italic border-l-4 border-blue-600 pl-4">Cursus Algorithmique & Données</h1>
            <span class="text-sm opacity-60" x-text="courses.length + ' modules chargés'"></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="course in courses" :key="course.id">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between transform transition hover:-translate-y-1">
                    <div>
                        <div class="text-xs font-bold text-blue-500 uppercase mb-1" x-text="'Module ' + course.module_id"></div>
                        <h3 class="text-lg font-bold mb-3" x-text="course.title"></h3>
                    </div>
                    <button @click="activeCourse = course" class="w-full bg-slate-100 dark:bg-slate-700 hover:bg-blue-600 hover:text-white py-2 rounded-lg font-bold transition">Accéder au contenu</button>
                </div>
            </template>
        </div>
    </main>

    <div x-show="activeCourse" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-5xl h-[90vh] rounded-2xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-4 border-b dark:border-slate-700 flex justify-between bg-blue-600 text-white">
                <span class="font-bold" x-text="activeCourse?.title"></span>
                <button @click="activeCourse = null" class="hover:rotate-90 transition-transform"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-8 prose dark:prose-invert max-w-none">
                <div x-html="activeCourse?.content"></div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            // Initialisation de la connexion Supabase avec tes vrais identifiants
            const client = supabase.createClient(
                'https://ubmewtlymrnbcamanjhs.supabase.co', 
                'sb_publishable_EY6s8jOGhajZ_aBjQgLkdQ_58aiZhxO'
            );

            return {
                isDark: true,
                activeCourse: null,
                courses: [],

                async init() {
                    // Récupération des données dès le chargement
                    const { data, error } = await client
                        .from('courses')
                        .select('*')
                        .order('module_id', { ascending: true });

                    if (error) {
                        alert("Erreur de connexion à la base de données");
                        console.error(error);
                    } else {
                        this.courses = data;
                    }
                }
            }
        }
    </script>
</body>
    </html>
